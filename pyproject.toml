[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edgewake"
version = "0.1.0"
description = "Edge wake-word data generation and training toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "piper-sample-generator==3.2.0",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
edgewake-tts = "edgewake.tts.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

