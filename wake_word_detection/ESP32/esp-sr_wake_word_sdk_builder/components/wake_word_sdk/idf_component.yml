# ===========================================================================
# Wake Word SDK 组件依赖声明
# ===========================================================================
#
# 该文件声明 wake_word_sdk 组件的依赖项。
#
# ============================================================================
# 依赖说明
# ============================================================================
#
# 必需依赖：
# - espressif/esp-sr: ESP-IDF 语音识别组件，提供 Wakenet、Multinet、AFE 功能
#
# 可选依赖：
# - 78/esp-opus-encoder: Opus 音频编码器，用于编码唤醒词音频
#
# ============================================================================
# 使用者注意
# ============================================================================
#
# 使用此 SDK 的项目必须在自己的 idf_component.yml 中声明 esp-sr 依赖：
#
# dependencies:
#   espressif/esp-sr: ~2.2.0
#
# 这是因为 esp-sr 包含运行时模型，无法打包进静态库。
#

dependencies:
  # ESP-IDF 版本要求
  idf:
    version: '>=5.4.0'
  
  # ESP-SR 语音识别组件
  # 提供 Wakenet（唤醒词检测）、Multinet（命令词识别）、AFE（音频前端）
  espressif/esp-sr: ~2.2.0
  
  # Opus 编码器组件
  # 用于将唤醒词音频编码为 Opus 格式
  78/esp-opus-encoder: ~2.4.1
  
  # Opus 库组件
  # 提供 opus.h 头文件
  78/esp-opus: ~1.0.5
