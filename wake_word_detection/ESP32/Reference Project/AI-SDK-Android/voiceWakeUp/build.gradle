plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.kezong.fat-aar'
}

// SDK 混淆规则统一维护在 ai-sdk/proguard-rules.pro。
def aiSdkProguardRules = rootProject.file('ai-sdk/proguard-rules.pro')

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "SDK_VERSION", SDK_VERSION

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // 子模块不单独混淆：统一交由 fat-aar 宿主（ai-sdk）做「单次混淆」，
            // 避免子模块先混淆、宿主再混淆造成的「多次混淆」（mapping 断链、跨模块误裁、优化叠加）。
            minifyEnabled false
            // minifyEnabled=false 时 proguardFiles 不生效，混淆规则统一在 ai-sdk 宿主应用，故此处不再配置。
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), aiSdkProguardRules
            // 保留 consumer 规则：随 AAR 传递，最终在宿主统一混淆并下发给客户 App。
            consumerProguardFiles aiSdkProguardRules
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.0')

    /*api(name: 'wakeup-v1.0.15.260312.174629-release', ext: 'aar')*/

    embed(name: 'wakeup-v1.0.15.260312.174629-release', ext: 'aar')

}
