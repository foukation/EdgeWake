plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.fxzs.lingxiagent'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    /**
     * 测试版本4位，第四位代表测试  1.1.0.1
     * 版本管理文档 ：https://ai.feishu.cn/docx/SFNQdkVWBoo2flxlPJgcpFNynhf
     * 最新安审版本发布：200  2.0.0
     * 发蒲公英版本需增加当前日期：1.1.0.202604151700
     */
    defaultConfig {
        applicationId "com.fxzs.lingxiagent"
        minSdk 26
        targetSdk 33
        versionCode 202
        versionName "2.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 极光SDK需要的manifestPlaceholders
        manifestPlaceholders = [
            JPUSH_PKGNAME : applicationId,
            JPUSH_APPKEY : "6c6b9df7a3c72fcca64c5d9e",
            JPUSH_CHANNEL : "developer-default"
        ]

        buildConfigField "String", "HONOR_ACCESS_KEY", "\"${honor_access_key}\""
        buildConfigField "String", "HONOR_SECRET_KEY", "\"${honor_secret_key}\""

        ndk {
            abiFilters 'arm64-v8a'
        }

// 编译c++       externalNativeBuild {
//            cmake { cppFlags += "-std=c++17" }
//        }
    }

// 编译c++   ndkVersion = "28.2.13676358"

    signingConfigs {
        debug {
            // Release签名配置
            storeFile file("../keystore_release.jks")
            storePassword "fxzsqwer"
            keyAlias "lingxi"
            keyPassword "fxzsasdf"
        }
        release {
            // Release签名配置
            storeFile file("../keystore_release.jks")
            storePassword "fxzsqwer"
            keyAlias "lingxi"
            keyPassword "fxzsasdf"
        }
    }

    buildTypes {
        debug {
            // 让debug版本也使用release签名，方便测试极光推送
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 使用release签名
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs','src/main/jniLibs']//加载so

            //aidl.srcDirs = ['src/main/aidl']
        }
        test {
            java {
                // 仅编译我们新增的服务层单测，避免编译历史用例
                srcDirs = ['src/test/java/com/fxzs/lingxiagent/viewmodel/chat/service']
            }
        }

    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    testOptions {
        unitTests.all {
            // 仅运行我们新增且不依赖 Android Runtime 的服务层单测
            filter {
                includeTestsMatching "com.fxzs.lingxiagent.viewmodel.chat.service.ConversationServiceTest"
                includeTestsMatching "com.fxzs.lingxiagent.viewmodel.chat.service.StreamingServiceTest"
                includeTestsMatching "com.fxzs.lingxiagent.viewmodel.chat.service.MessageRenderServiceTest"
            }
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def appName = "LingXi"
            def versionName = variant.versionName
            def buildTypeName = variant.buildType.name
            def appGenerateTime = new Date().format("yyyyMMddHHmm")
            def flavorName = variant.flavorName
            // 新的 APK 名字
            outputFileName = "${appName}_${flavorName}_${versionName}_${appGenerateTime}_${buildTypeName}.apk"
        }
    }

    flavorDimensions "device", "brand"
    productFlavors {
        // 设备维度
        phone {
            dimension "device"
        }

        tablet {
            dimension "device"
        }

        laiKu {
            dimension "brand"
            buildConfigField "String", "BRAND", "\"laiKu\""
            resValue "string", "flavor_brand", "laiKu"
            manifestPlaceholders = [
                    CHANNEL_NAME: "laiKu",
                    WIDGET_ENABLED: "true"
            ]
        }

        zte {
            dimension "brand"
            buildConfigField "String", "BRAND", "\"zte\""
            resValue "string", "flavor_brand", "zte"
            manifestPlaceholders = [
                    CHANNEL_NAME: "zte",
                    WIDGET_ENABLED: "true"
            ]
        }

        beta {
            dimension "brand"
            buildConfigField "String", "BRAND", "\"beta\""
            resValue "string", "flavor_brand", "beta"
            manifestPlaceholders = [
                    CHANNEL_NAME: "beta",
                    WIDGET_ENABLED: "true"
            ]
        }
        iflytek {
            dimension "brand"
            buildConfigField "String", "BRAND", "\"iflytek\""
            resValue "string", "flavor_brand", "iflytek"
            manifestPlaceholders = [
                    CHANNEL_NAME: "iflytek",
                    WIDGET_ENABLED: "false"
            ]
        }

        // 渠道维度：正式渠道
        prod {
            dimension "brand"
            buildConfigField "String", "BRAND", "\"prod\""
            resValue "string", "flavor_brand", "prod"
            manifestPlaceholders = [
                    CHANNEL_NAME: "prod",
                    WIDGET_ENABLED: "true"
            ]
        }


    }

    packagingOptions {//分享word导出 混淆
        pickFirst 'schemaorg_apache_xmlbeans/**'
        pickFirst 'org/openxmlformats/schemas/**'
        pickFirst 'META-INF/NOTICE'
        pickFirst 'META-INF/LICENSE'
        pickFirst 'META-INF/*.kotlin_module'
    }

//    externalNativeBuild {//编译c++代码
//        cmake {
//            // CMakeLists.txt 相对于 module 根目录的路径
//            path = file("src/main/cpp/CMakeLists.txt")
//            version = "3.22.1"
//        }
//    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ViewModel and LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.3'

    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // UI Libraries
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.core:core-animation:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // 测试环境 Beta 渠道 Debug 包：内存泄漏检测（Release 不含 debug 依赖）
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    implementation 'com.github.bumptech.glide:okhttp3-integration:4.12.0'
    implementation 'com.tencent:mmkv:2.0.0'
    implementation 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.6'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    implementation "io.noties.markwon:core:4.6.2"
    implementation 'io.noties.markwon:image:4.6.2'
    implementation 'io.noties.markwon:image-glide:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2' // 添加表格支持
//    implementation 'io.noties.markwon:ext-latex:4.6.2'
//    implementation 'io.noties.markwon:inline-parser:4.6.2'

    implementation group: 'io.noties.markwon', name: 'recycler-table', version: '4.6.2'
    implementation group: 'io.noties.markwon', name: 'recycler', version: '4.6.2'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.17.0' // 添加 GFM 表格支持

    // 代码高亮支持 - 使用正确的配置方式
    implementation 'io.noties.markwon:syntax-highlight:4.6.2'
    implementation group: 'io.noties', name: 'prism4j', version: '2.0.0'
    annotationProcessor group: 'io.noties', name: 'prism4j-bundler', version: '2.0.0'

    configurations.all {
        resolutionStrategy {
            force 'org.commonmark:commonmark:0.17.0'
        }
        exclude group: 'com.atlassian.commonmark'
        exclude group: 'org.jetbrains', module: 'annotations-java5'
    }
    implementation 'com.qcloud.cos:cos-android:5.9.+'

//    // 极光核心SDK
//    implementation 'cn.jiguang.sdk:jcore:5.1.0'
//    // 极光推送SDK
//    implementation 'cn.jiguang.sdk:jpush:5.8.0'

    def eventbus_version = '3.2.0'
    implementation "org.greenrobot:eventbus:$eventbus_version"

    // pdf文档生成插件
    implementation 'com.itextpdf:itext7-core:7.2.3'
    // word文档生成
    implementation 'org.apache.poi:poi:5.2.0'
    implementation 'org.apache.poi:poi-ooxml:5.2.0'
    implementation 'org.apache.xmlbeans:xmlbeans:5.1.1'
    //日志打印：小度识别需要
    implementation 'com.jakewharton.timber:timber:5.0.1'

    implementation 'org.java-websocket:Java-WebSocket:1.5.1'

    implementation 'com.amap.api:location:6.4.9'
    //kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    implementation 'androidx.core:core-ktx:1.13.1'
    //百度
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation 'androidx.media:media:1.4.0'
    implementation("com.squareup.okhttp3:okhttp-sse:4.12.0")
    implementation 'com.tencent.bugly:crashreport:latest.release'
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'

    implementation 'com.baidu.mobstat:mtj-sdk:latest.integration'

//    implementation 'com.lingxi:nexuspilot:1.0.5'

    implementation files('libs/nexus-pilot-1.0.11-debug.aar')
    implementation 'com.belerweb:pinyin4j:2.5.1'
}
