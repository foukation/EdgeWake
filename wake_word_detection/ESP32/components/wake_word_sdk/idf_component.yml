# ===========================================================================
# Wake Word SDK 组件依赖声明（预编译库版本）
# ===========================================================================
#
# 该文件声明 wake_word_sdk 组件的依赖项。
#
# ============================================================================
# 使用者注意
# ============================================================================
#
# 使用此 SDK 的项目必须确保以下依赖可用：
# - espressif/esp-sr: 语音识别组件
# - 78/esp-opus-encoder: Opus 编码器
#

dependencies:
  # ESP-IDF 版本要求
  idf:
    version: '>=5.4.0'
  
  # ESP-SR 语音识别组件
  espressif/esp-sr: ~2.2.0
  
  # Opus 编码器组件
  78/esp-opus-encoder: ~2.4.1
  
  # Opus 库组件
  78/esp-opus: ~1.0.5
